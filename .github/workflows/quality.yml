name: Quality Gate

on:

  push:

  pull_request:

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/architecture-check.js

      - run: npx tsc --noEmit
